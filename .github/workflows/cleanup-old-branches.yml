name: Cleanup obsolete branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete obsolete remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "agent/fiinquant-audit-20260808"
            "agent/fix-fiinquant-scanner"
            "agent/scanner-v1"
          )
          for branch in "${branches[@]}"; do
            status=$(curl --silent --show-error --output /tmp/delete-ref.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${branch}")
            if [ "$status" = "204" ]; then
              echo "Deleted ${branch}"
            elif [ "$status" = "404" ] || [ "$status" = "422" ]; then
              echo "${branch} already absent or protected from deletion (HTTP ${status})"
            else
              cat /tmp/delete-ref.json
              echo "Failed deleting ${branch}: HTTP ${status}" >&2
              exit 1
            fi
          done
