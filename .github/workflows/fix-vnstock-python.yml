name: Fix Vnstock Python resolution

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporarily patch Vnstock Python resolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch Vnstock interpreter resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('examples/workstation/scanner/vite-plugin.ts')
          text = path.read_text(encoding='utf-8')
          old = """const VNSTOCK_DIR = path.join(SIDECARS_DIR, 'vnstock');
const VNSTOCK_SCRIPT = path.join(VNSTOCK_DIR, 'vnstock_sidecar.py');
const FIINQUANT_VENV = path.join(SIDECARS_DIR, 'fiinquant', '.venv');
"""
          new = """const VNSTOCK_DIR = path.join(SIDECARS_DIR, 'vnstock');
const VNSTOCK_SCRIPT = path.join(VNSTOCK_DIR, 'vnstock_sidecar.py');
const VNSTOCK_VENV = path.join(VNSTOCK_DIR, '.venv');
const FIINQUANT_VENV = path.join(SIDECARS_DIR, 'fiinquant', '.venv');
"""
          if old not in text:
              raise SystemExit('Vnstock path marker not found')
          text = text.replace(old, new, 1)
          old = """function vnstockPython(): string {
  return process.env.VNSTOCK_PYTHON || scannerPython();
}
"""
          new = """function vnstockPython(): string {
  if (process.env.VNSTOCK_PYTHON) return process.env.VNSTOCK_PYTHON;
  const vnstockVenv = process.platform === 'win32'
    ? path.join(VNSTOCK_VENV, 'Scripts', 'python.exe')
    : path.join(VNSTOCK_VENV, 'bin', 'python');
  if (existsSync(vnstockVenv)) return vnstockVenv;
  if (process.env.VIRTUAL_ENV) {
    const activeVenv = process.platform === 'win32'
      ? path.join(process.env.VIRTUAL_ENV, 'Scripts', 'python.exe')
      : path.join(process.env.VIRTUAL_ENV, 'bin', 'python');
    if (existsSync(activeVenv)) return activeVenv;
  }
  return process.platform === 'win32' ? 'python' : 'python3';
}
"""
          if old not in text:
              raise SystemExit('vnstockPython marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/workstation/scanner/vite-plugin.ts
          git commit -m "fix Vnstock Python environment selection"
          git push
