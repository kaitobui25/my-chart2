name: Recompile Agentic Default Model

on:
  push:
    branches:
      - agent/fix-agentic-default-model

permissions:
  contents: write

jobs:
  recompile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@v0.85.4
        with:
          version: v0.85.4

      - name: Generate default-model source and lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/daily-current-doc-sync.md')
          text = path.read_text(encoding='utf-8')
          old = "engine:\n  id: copilot\n  model: gpt-5-mini\n"
          if old not in text:
              raise SystemExit('expected pinned gpt-5-mini engine block not found')
          path.write_text(text.replace(old, 'engine: copilot\n', 1), encoding='utf-8')
          PY

          gh aw validate daily-current-doc-sync --strict --no-check-update
          gh aw compile daily-current-doc-sync --strict --no-check-update

          mkdir -p agent/generated
          cp .github/workflows/daily-current-doc-sync.md agent/generated/daily-current-doc-sync.md
          cp .github/workflows/daily-current-doc-sync.lock.yml agent/generated/daily-current-doc-sync.lock.yml

      - name: Commit generated copies
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/generated/daily-current-doc-sync.md agent/generated/daily-current-doc-sync.lock.yml
          git commit -m 'generate default-model agentic workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
