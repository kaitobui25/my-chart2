name: Verify Binance PR

on:
  pull_request:
    branches: [main]
    paths:
      - examples/providers/binance.ts
      - examples/providers/binance-cache.ts
      - examples/providers/binance.test.ts
      - examples/workstation/**
      - README.md

permissions:
  contents: read

jobs:
  verify-binance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:demo
      - run: git diff --check origin/main...HEAD
