name: Apply FiinQuant startup patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fiinquant-autostart-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python .github/scripts/patch_fiinquant_autostart.py
      - run: node --check scripts/run-assistant.mjs
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run-assistant.mjs package.json
          git commit -m "fix FiinQuant optional startup isolation"
          git push
