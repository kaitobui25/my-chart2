name: Fix Binance provider symbol persistence

on:
  push:
    branches:
      - agent/binance-indexeddb
    paths:
      - .github/workflows/fix-binance-provider-symbols.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Keep chart symbols separate per provider
        shell: python
        run: |
          from pathlib import Path
          path = Path('examples/workstation/main.ts')
          text = path.read_text()
          text = text.replace(
              "const PROVIDER_WATCHLISTS_KEY = 'l2chart.providerWatchlists.v1';",
              "const PROVIDER_WATCHLISTS_KEY = 'l2chart.providerWatchlists.v1';\nconst PROVIDER_CHART_SYMBOLS_KEY = 'l2chart.providerChartSymbols.v1';",
          )
          old = """function setActiveProvider(provider: PriceProviderId): void {
            if (provider === 'dnse' && !dnseFeed) provider = 'demo';
            const previousProvider = activeProvider;
            const previousWatchlist = tradingWorkspace?.getWatchlist() ?? [];
            activeProvider = provider;
            localStorage.setItem(ACTIVE_PROVIDER_KEY, provider);

            if (providerFamily(previousProvider) !== providerFamily(provider)) {
              const defaultSymbol = defaultSymbolsForProvider(provider)[0];
              for (const tile of tiles) tile.setSymbol(defaultSymbol, false);
            }

            const previousWatchlistKey = providerWatchlistKey(previousProvider);
            const nextWatchlistKey = providerWatchlistKey(provider);
"""
          new = """function setActiveProvider(provider: PriceProviderId): void {
            if (provider === 'dnse' && !dnseFeed) provider = 'demo';
            const previousProvider = activeProvider;
            const previousWatchlist = tradingWorkspace?.getWatchlist() ?? [];
            const chartSymbols = readStoredJson<Record<string, string[]>>(PROVIDER_CHART_SYMBOLS_KEY, {});
            chartSymbols[providerWatchlistKey(previousProvider)] = tiles.map((tile) => tile.symbol);
            activeProvider = provider;
            localStorage.setItem(ACTIVE_PROVIDER_KEY, provider);

            if (previousProvider !== provider) {
              const defaults = defaultSymbolsForProvider(provider);
              const nextSymbols = chartSymbols[providerWatchlistKey(provider)] ?? defaults;
              for (const [index, tile] of tiles.entries()) {
                tile.setSymbol(nextSymbols[index] ?? defaults[index % defaults.length], false);
              }
              chartSymbols[providerWatchlistKey(provider)] = tiles.map((tile) => tile.symbol);
              writeStoredJson(PROVIDER_CHART_SYMBOLS_KEY, chartSymbols);
            }

            const previousWatchlistKey = providerWatchlistKey(previousProvider);
            const nextWatchlistKey = providerWatchlistKey(provider);
"""
          if old not in text:
              raise SystemExit('setActiveProvider block not found')
          text = text.replace(old, new)
          old = """function createTileForSlot(index: number, template?: TileTemplate): Tile {
            const savedSymbol = uiPreferences.symbols[index]?.trim().toUpperCase();
            const symbol = template?.symbol?.trim().toUpperCase()
              || savedSymbol
              || DEFAULT_SYMBOLS[index % DEFAULT_SYMBOLS.length];
"""
          new = """function createTileForSlot(index: number, template?: TileTemplate): Tile {
            const providerSymbols = readStoredJson<Record<string, string[]>>(PROVIDER_CHART_SYMBOLS_KEY, {})[
              providerWatchlistKey(activeProvider)
            ];
            const legacySymbol = isBinanceProvider(activeProvider)
              ? undefined
              : uiPreferences.symbols[index]?.trim().toUpperCase();
            const defaults = defaultSymbolsForProvider(activeProvider);
            const savedSymbol = providerSymbols?.[index]?.trim().toUpperCase() || legacySymbol;
            const symbol = template?.symbol?.trim().toUpperCase()
              || savedSymbol
              || defaults[index % defaults.length];
"""
          if old not in text:
              raise SystemExit('createTileForSlot block not found')
          text = text.replace(old, new)
          old = """  uiPreferences.symbols = nextSymbols;
            saveUiPreferences();
          }
"""
          new = """  uiPreferences.symbols = nextSymbols;
            saveUiPreferences();
            const providerSymbols = readStoredJson<Record<string, string[]>>(PROVIDER_CHART_SYMBOLS_KEY, {});
            providerSymbols[providerWatchlistKey(activeProvider)] = nextSymbols;
            writeStoredJson(PROVIDER_CHART_SYMBOLS_KEY, providerSymbols);
          }
"""
          if old not in text:
              raise SystemExit('persistTileSymbols block not found')
          text = text.replace(old, new)
          path.write_text(text)
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:demo
      - run: git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/fix-binance-provider-symbols.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep provider chart symbols isolated"
          git push
