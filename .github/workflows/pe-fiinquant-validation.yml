name: P/E FiinQuant validation

on:
  push:
    branches:
      - agent/pe-indicator-v1

permissions:
  contents: read

jobs:
  pe-fiinquant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck P/E modules
        run: |
          cat > tsconfig.pe.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "src/indicators/builtin/pe.ts",
              "src/indicators/builtin/pe-model.ts",
              "src/indicators/builtin/pe-cache.ts",
              "src/indicators/builtin/pe-client.ts",
              "src/indicators/builtin/pe-valuation-cache.ts",
              "src/indicators/builtin/pe-valuation-client.ts",
              "src/indicators/runtime-context.ts",
              "tests/unit/pe-indicator.test.ts",
              "tests/unit/pe-load-policy.test.ts"
            ]
          }
          JSON
          npx tsc -p tsconfig.pe.json

      - name: Run P/E unit tests
        run: npx vitest run tests/unit/pe-indicator.test.ts tests/unit/pe-load-policy.test.ts

      - name: Build workstation
        run: npm run build:demo

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install sidecar test dependency
        run: python -m pip install aiohttp

      - name: Run FiinQuant sidecar tests
        run: python -m unittest discover -s examples/sidecars/fiinquant -v
