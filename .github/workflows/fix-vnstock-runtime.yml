name: Fix Vnstock runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vnstock-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch Vnstock runtime behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          sidecar = Path('examples/sidecars/vnstock/vnstock_sidecar.py')
          text = sidecar.read_text(encoding='utf-8')
          text = text.replace("PORT = int(os.getenv('PORT', '8730'))", "PORT = int(os.getenv('PORT', '8740'))", 1)
          old = '''    def health(self) -> dict[str, Any]:\n        try:\n            self._ensure_clients()\n            return {\n                'ok': True,\n                'configured': True,\n                'provider': 'Vnstock',\n                'routing': 'Unified UI (KBS/VCI auto)',\n                'timezone': 'Asia/Ho_Chi_Minh',\n                'pollIntervalSeconds': POLL_INTERVAL_SECONDS,\n            }\n        except Exception as exc:\n            return {\n                'ok': False,\n                'configured': False,\n                'provider': 'Vnstock',\n                'routing': 'Unified UI (KBS/VCI auto)',\n                'timezone': 'Asia/Ho_Chi_Minh',\n                'pollIntervalSeconds': POLL_INTERVAL_SECONDS,\n                'error': str(exc),\n            }\n'''
          new = '''    def health(self) -> dict[str, Any]:\n        # Health checks must never consume upstream Vnstock/API quota. The\n        # launcher polls this endpoint while waiting for the local sidecar, so\n        # constructing Market/Reference here can create a retry storm when the\n        # guest rate limit is already exhausted. Data clients stay fully lazy.\n        try:\n            from importlib.util import find_spec\n            configured = find_spec('vnstock') is not None\n        except Exception:\n            configured = False\n        return {\n            'ok': True,\n            'configured': configured,\n            'provider': 'Vnstock',\n            'routing': 'Unified UI (KBS/VCI auto)',\n            'timezone': 'Asia/Ho_Chi_Minh',\n            'pollIntervalSeconds': POLL_INTERVAL_SECONDS,\n            **({} if configured else {'warning': 'vnstock package is not installed'}),\n        }\n'''
          if old not in text:
              raise SystemExit('health marker not found')
          sidecar.write_text(text.replace(old, new, 1), encoding='utf-8')

          plugin = Path('examples/workstation/scanner/vite-plugin.ts')
          text = plugin.read_text(encoding='utf-8')
          old = """const VNSTOCK_DIR = path.join(SIDECARS_DIR, 'vnstock');\nconst VNSTOCK_SCRIPT = path.join(VNSTOCK_DIR, 'vnstock_sidecar.py');\nconst FIINQUANT_VENV = path.join(SIDECARS_DIR, 'fiinquant', '.venv');\n"""
          new = """const VNSTOCK_DIR = path.join(SIDECARS_DIR, 'vnstock');\nconst VNSTOCK_SCRIPT = path.join(VNSTOCK_DIR, 'vnstock_sidecar.py');\nconst VNSTOCK_VENV = path.join(VNSTOCK_DIR, '.venv');\nconst ROOT_VENV = path.join(REPO_ROOT, '.venv');\nconst FIINQUANT_VENV = path.join(SIDECARS_DIR, 'fiinquant', '.venv');\n"""
          if old not in text:
              raise SystemExit('Vnstock path marker not found')
          text = text.replace(old, new, 1)
          old = """function vnstockPython(): string {\n  return process.env.VNSTOCK_PYTHON || scannerPython();\n}\n"""
          new = """function vnstockPython(): string {\n  if (process.env.VNSTOCK_PYTHON) return process.env.VNSTOCK_PYTHON;\n  const candidates = [VNSTOCK_VENV, ROOT_VENV];\n  if (process.env.VIRTUAL_ENV) candidates.push(process.env.VIRTUAL_ENV);\n  for (const candidate of candidates) {\n    const python = process.platform === 'win32'\n      ? path.join(candidate, 'Scripts', 'python.exe')\n      : path.join(candidate, 'bin', 'python');\n    if (existsSync(python)) return python;\n  }\n  return process.platform === 'win32' ? 'python' : 'python3';\n}\n"""
          if old not in text:
              raise SystemExit('vnstockPython marker not found')
          plugin.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/sidecars/vnstock/vnstock_sidecar.py examples/workstation/scanner/vite-plugin.ts
          git commit -m "fix Vnstock health checks and Python selection"
          git push
