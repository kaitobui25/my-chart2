name: Apply Binance IndexedDB integration

on:
  push:
    branches:
      - agent/binance-indexeddb
    paths:
      - .github/workflows/apply-binance-indexeddb.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize integration patch
        shell: bash
        run: |
          mkdir -p scripts
          cat <<'PATCH_PAYLOAD' | base64 -d | gzip -dc > scripts/apply-binance-indexeddb.mjs
          
          PATCH_PAYLOAD
          node --check scripts/apply-binance-indexeddb.mjs

      - name: Apply Binance integration
        env:
          CLEANUP_PATCH_FILES: '1'
        run: node scripts/apply-binance-indexeddb.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build workstation
        run: npm run build:demo

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Binance Spot and Futures data"
          git push
