name: Canonical documentation synchronization

on:
  workflow_dispatch:
  schedule:
    # 05:37 Asia/Tokyo (JST) = 20:37 UTC on the previous calendar day.
    - cron: '37 20 * * *'

permissions:
  contents: write

concurrency:
  group: current-doc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_MODEL: opencode/deepseek-v4-flash-free
      OPENCODE_VERSION: 1.18.15
      DOC_SYNC_MAX_SOURCE_FILES: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Resolve target and baseline
        id: state
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --prune origin main
          target_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"

          if [ "$target_sha" != "$remote_main_sha" ]; then
            echo "::error::main advanced before documentation synchronization began; a later run will document the newer main."
            exit 1
          fi

          baseline_sha="$(jq -r '.documented_sha' docs/current/_meta.json)"
          mode="incremental"
          should_run=true
          meaningful_changed_path_count=0
          japan_day="$(TZ=Asia/Tokyo date +%u)"

          if [ "$japan_day" = "7" ]; then
            mode="full-reconciliation"
          elif [ "$baseline_sha" = "$target_sha" ]; then
            should_run=false
          elif ! git cat-file -e "${baseline_sha}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$baseline_sha" "$target_sha"; then
            mode="full-reconciliation"
          else
            state_context="$(
              node scripts/build-current-doc-context.mjs \
                "$baseline_sha" \
                "$target_sha" \
                incremental \
                "$DOC_SYNC_MAX_SOURCE_FILES"
            )"
            meaningful_changed_path_count="$(jq -r '.changed_path_count' <<<"$state_context")"
            if [ "$meaningful_changed_path_count" -eq 0 ]; then
              should_run=false
            fi
          fi

          {
            echo "target_sha=$target_sha"
            echo "baseline_sha=$baseline_sha"
            echo "mode=$mode"
            echo "should_run=$should_run"
          } >> "$GITHUB_OUTPUT"

          echo "target_sha=$target_sha"
          echo "baseline_sha=$baseline_sha"
          echo "mode=$mode"
          echo "should_run=$should_run"
          echo "meaningful_changed_path_count=$meaningful_changed_path_count"

      - name: Install OpenCode
        if: steps.state.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Run OpenCode semantic documentation agent
        if: steps.state.outputs.should_run == 'true'
        env:
          OPENCODE_CONFIG: ${{ github.workspace }}/agent/opencode/current-doc-sync.json
          TARGET_SHA: ${{ steps.state.outputs.target_sha }}
          BASELINE_SHA: ${{ steps.state.outputs.baseline_sha }}
          SYNC_MODE: ${{ steps.state.outputs.mode }}
        run: |
          set -o pipefail

          bounded_context="$(
            node scripts/build-current-doc-context.mjs \
              "$BASELINE_SHA" \
              "$TARGET_SHA" \
              "$SYNC_MODE" \
              "$DOC_SYNC_MAX_SOURCE_FILES"
          )"
          echo "OpenCode bounded context: $bounded_context"

          timeout 1200s opencode run --auto \
            --model "$OPENCODE_MODEL" \
            "Read and follow agent/prompts/daily-current-doc-sync.md exactly. Runtime context: target_sha=${TARGET_SHA}; baseline_sha=${BASELINE_SHA}; synchronization_mode=${SYNC_MODE}; bounded_context=${bounded_context}. Work only in this checked-out repository. Do not commit, push, create PRs, or use the web. Respect the bounded discovery budget and stop immediately after reviewing the semantic diff you actually edited." \
            2>&1 | tee /tmp/opencode-doc-sync.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Detect semantic doc changes
        if: steps.state.outputs.should_run == 'true'
        id: semantic
        run: |
          set -euo pipefail

          changed_paths="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          if [ -z "$changed_paths" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenCode made no semantic documentation edits."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              docs/current/README.md|\
              docs/current/ARCHITECTURE.md|\
              docs/current/FEATURES.md|\
              docs/current/DATA_SOURCES.md|\
              docs/current/SCANNER.md|\
              docs/current/REPLAY.md|\
              docs/current/OPERATIONS.md|\
              docs/current/RECENT_CHANGES.md)
                ;;
              *)
                echo "::error::OpenCode changed a forbidden path: $path"
                exit 1
                ;;
            esac
          done <<<"$changed_paths"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Synchronize snapshot metadata and headers
        if: >-
          steps.state.outputs.should_run == 'true' &&
          (steps.state.outputs.target_sha != steps.state.outputs.baseline_sha ||
          steps.semantic.outputs.changed == 'true')
        env:
          TARGET_SHA: ${{ steps.state.outputs.target_sha }}
          SYNC_MODE: ${{ steps.state.outputs.mode }}
        run: node scripts/sync-current-doc-snapshot.mjs "$TARGET_SHA" "$SYNC_MODE"

      - name: Validate docs-only result
        if: steps.state.outputs.should_run == 'true'
        id: validate
        env:
          TARGET_SHA: ${{ steps.state.outputs.target_sha }}
          SYNC_MODE: ${{ steps.state.outputs.mode }}
        run: |
          set -euo pipefail

          node scripts/check-current-docs.mjs

          changed_paths="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          if [ -z "$changed_paths" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Full reconciliation found no correction and the snapshot is already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              docs/current/README.md|\
              docs/current/ARCHITECTURE.md|\
              docs/current/FEATURES.md|\
              docs/current/DATA_SOURCES.md|\
              docs/current/SCANNER.md|\
              docs/current/REPLAY.md|\
              docs/current/OPERATIONS.md|\
              docs/current/RECENT_CHANGES.md|\
              docs/current/_meta.json)
                ;;
              *)
                echo "::error::Documentation sync changed a forbidden path: $path"
                exit 1
                ;;
            esac
          done <<<"$changed_paths"

          documented_sha="$(jq -r '.documented_sha' docs/current/_meta.json)"
          documented_mode="$(jq -r '.mode' docs/current/_meta.json)"

          if [ "$documented_sha" != "$TARGET_SHA" ]; then
            echo "::error::docs/current/_meta.json documented_sha=$documented_sha but target=$TARGET_SHA"
            exit 1
          fi

          if [ "$documented_mode" != "$SYNC_MODE" ]; then
            echo "::error::docs/current/_meta.json mode=$documented_mode but expected=$SYNC_MODE"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit validated docs directly to main
        if: steps.state.outputs.should_run == 'true' && steps.validate.outputs.changed == 'true'
        env:
          TARGET_SHA: ${{ steps.state.outputs.target_sha }}
        run: |
          set -euo pipefail

          git fetch --prune origin main
          remote_main_sha="$(git rev-parse origin/main)"
          if [ "$remote_main_sha" != "$TARGET_SHA" ]; then
            echo "::error::main advanced while documentation synchronization was running; refusing to overwrite newer work."
            exit 1
          fi

          short_sha="${TARGET_SHA:0:7}"

          git add \
            docs/current/README.md \
            docs/current/ARCHITECTURE.md \
            docs/current/FEATURES.md \
            docs/current/DATA_SOURCES.md \
            docs/current/SCANNER.md \
            docs/current/REPLAY.md \
            docs/current/OPERATIONS.md \
            docs/current/RECENT_CHANGES.md \
            docs/current/_meta.json

          git commit -m "docs: sync current documentation through ${short_sha}"
          git push origin HEAD:main
