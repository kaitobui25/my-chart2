name: TEMP pin supported Copilot model

on:
  push:
    branches:
      - agent/fix-agentic-supported-model

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin supported Copilot CLI model
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/daily-current-doc-sync.md')
          text = p.read_text()
          old = 'engine: copilot\nstrict: true'
          new = 'engine:\n  id: copilot\n  model: claude-sonnet-4.6\nstrict: true'
          if old not in text:
              raise SystemExit('expected engine block not found')
          p.write_text(text.replace(old, new, 1))

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@v0.85.4
        with:
          version: v0.85.4

      - name: Strict validate and compile
        run: |
          gh aw validate daily-current-doc-sync --strict --no-check-update
          gh aw compile daily-current-doc-sync --strict --no-check-update

      - name: Commit compiler output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/daily-current-doc-sync.md .github/workflows/daily-current-doc-sync.lock.yml
          git diff --cached --check
          git commit -m "Pin agentic docs to Claude Sonnet 4.6 [skip temp-pin]"
          git push origin HEAD:agent/fix-agentic-supported-model
