name: Build Agentic Docs Lock

on:
  push:
    branches:
      - agent/daily-current-doc-sync
    paths:
      - .github/workflows/daily-current-doc-sync.md
      - .github/workflows/build-agentic-doc-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@v0.85.4
        with:
          version: v0.85.4

      - name: Compile strict Agentic Workflow
        run: gh aw compile daily-current-doc-sync --strict --no-check-update

      - name: Validate strict Agentic Workflow
        run: gh aw validate daily-current-doc-sync --strict --no-check-update

      - name: Commit compiled lock
        run: |
          git add .github/workflows/daily-current-doc-sync.lock.yml
          if git diff --cached --quiet; then
            echo "Compiled lock already matches the source workflow."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "compile daily current docs workflow"
          git push origin HEAD:agent/daily-current-doc-sync

      - name: Upload compiled lock
        uses: actions/upload-artifact@v4
        with:
          name: daily-current-doc-sync-lock
          path: .github/workflows/daily-current-doc-sync.lock.yml
          if-no-files-found: error
