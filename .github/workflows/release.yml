name: Release npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.15.0

      - name: Verify release metadata and tag
        run: npm run verify:release

      - name: Install dependencies without a release cache
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install sidecar test dependency
        run: python -m pip install aiohttp

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete verification suite
        run: npm run verify

      - name: Audit release dependencies
        run: |
          npm audit --audit-level=high
          python scripts/audit-provider.py

      - name: Verify release artifact and clean workspace
        run: |
          npm pack --dry-run
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance

      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
