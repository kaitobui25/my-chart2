name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate current documentation
        run: |
          node --check scripts/check-current-docs.mjs
          node --check scripts/sync-current-doc-snapshot.mjs
          node scripts/check-current-docs.mjs

  docs-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate OpenCode docs-sync runtime
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');

          const config = JSON.parse(fs.readFileSync('agent/opencode/current-doc-sync.json', 'utf8'));
          const edit = config.permission?.edit ?? {};
          const bash = config.permission?.bash ?? {};
          const allowed = [
            'docs/current/README.md',
            'docs/current/ARCHITECTURE.md',
            'docs/current/FEATURES.md',
            'docs/current/DATA_SOURCES.md',
            'docs/current/SCANNER.md',
            'docs/current/REPLAY.md',
            'docs/current/OPERATIONS.md',
            'docs/current/RECENT_CHANGES.md',
          ];

          if (edit['*'] !== 'deny') {
            throw new Error('OpenCode edit permissions must default to deny');
          }
          for (const path of allowed) {
            if (edit[path] !== 'allow') throw new Error(`OpenCode must allow semantic edits to ${path}`);
          }
          if (edit['docs/current/_meta.json'] === 'allow' || edit['docs/current/**'] === 'allow') {
            throw new Error('OpenCode must not own _meta.json or a wildcard docs/current edit permission');
          }
          if (config.permission?.webfetch !== 'deny' || config.permission?.websearch !== 'deny') {
            throw new Error('OpenCode docs-sync runtime must not have web access');
          }
          if (bash['*'] !== 'deny') {
            throw new Error('OpenCode bash permissions must default to deny');
          }
          NODE

          test -f agent/prompts/daily-current-doc-sync.md
          test -f .github/workflows/daily-current-doc-sync.yml
          test -f scripts/sync-current-doc-snapshot.mjs
          test ! -e .github/workflows/daily-current-doc-sync.md
          test ! -e .github/workflows/daily-current-doc-sync.lock.yml

          grep -Fq 'OPENCODE_MODEL: opencode/deepseek-v4-flash-free' .github/workflows/daily-current-doc-sync.yml
          grep -Fq 'OPENCODE_VERSION: 1.18.15' .github/workflows/daily-current-doc-sync.yml
          grep -Fq 'sync-current-doc-snapshot.mjs' .github/workflows/daily-current-doc-sync.yml
          grep -Fq 'node scripts/check-current-docs.mjs' .github/workflows/daily-current-doc-sync.yml

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and types
        run: |
          git diff --check
          node --check scripts/run-assistant.mjs
          npm run typecheck

      - name: Test chart behavior
        run: npm run test:unit

      - name: Build workstation
        run: npm run build:demo

      - name: Verify npm package
        run: npm run test:package

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser rendering and interaction
        run: npm run test:browser

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            examples/sidecars/fiinquant/requirements.txt
            examples/sidecars/fiinquant/requirements-provider.txt
            examples/sidecars/scanner/requirements.txt
            examples/sidecars/vnstock/requirements.txt

      - name: Install sidecar test dependency
        run: python -m pip install aiohttp

      - name: Test FiinQuant sidecar
        run: python -m unittest discover -s examples/sidecars/fiinquant

      - name: Test scanner sidecar
        run: python -m unittest discover -s examples/sidecars/scanner/tests -v

      - name: Test Vnstock sidecar
        run: python -m unittest discover -s examples/sidecars/vnstock -v

      - name: Audit runtime and provider dependencies
        run: python scripts/audit-provider.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Scan tracked files
        run: |
          python -m pip install detect-secrets
          detect-secrets-hook $(git ls-files \
            | grep -v '^docs/current/_meta.json$')
