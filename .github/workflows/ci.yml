name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate current documentation
        run: |
          node --check scripts/check-current-docs.mjs
          node scripts/check-current-docs.mjs

  agentic-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@v0.85.4
        with:
          version: v0.85.4

      - name: Validate Agentic Workflow
        run: gh aw validate daily-current-doc-sync --strict --no-check-update

      - name: Verify compiled lock is current
        run: |
          gh aw compile daily-current-doc-sync --strict --no-check-update
          git diff --exit-code -- .github/workflows/daily-current-doc-sync.lock.yml

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and types
        run: |
          git diff --check
          node --check scripts/run-assistant.mjs
          npm run typecheck

      - name: Test chart behavior
        run: npm run test:unit

      - name: Build workstation
        run: npm run build:demo

      - name: Verify npm package
        run: npm run test:package

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser rendering and interaction
        run: npm run test:browser

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            examples/sidecars/fiinquant/requirements.txt
            examples/sidecars/fiinquant/requirements-provider.txt
            examples/sidecars/scanner/requirements.txt
            examples/sidecars/vnstock/requirements.txt

      - name: Install sidecar test dependency
        run: python -m pip install aiohttp

      - name: Test FiinQuant sidecar
        run: python -m unittest discover -s examples/sidecars/fiinquant

      - name: Test scanner sidecar
        run: python -m unittest discover -s examples/sidecars/scanner/tests -v

      - name: Test Vnstock sidecar
        run: python -m unittest discover -s examples/sidecars/vnstock -v

      - name: Audit runtime and provider dependencies
        run: python scripts/audit-provider.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Scan tracked files
        run: |
          python -m pip install detect-secrets
          detect-secrets-hook $(git ls-files \
            | grep -v '^docs/current/_meta.json$' \
            | grep -v '^.github/workflows/daily-current-doc-sync.lock.yml$')
