name: Delete one-click branch after merge

on:
  push:
    branches: ['agent/one-click-fiinquant-dev']

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-after-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PR 13 merge and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            MERGED=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/13" \
              | python -c "import json,sys; print('yes' if json.load(sys.stdin).get('merged_at') else 'no')")
            if [ "$MERGED" = "yes" ]; then
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/one-click-fiinquant-dev"
              exit 0
            fi
            sleep 5
          done
          echo "PR 13 was not merged before timeout" >&2
          exit 1
