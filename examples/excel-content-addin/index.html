<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Data view</title>
    <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <nav class="view-tabs" role="tablist" aria-label="Chế độ hiển thị">
        <button id="chart-tab" type="button" role="tab" aria-controls="chart-view" aria-selected="true">Chart</button>
        <button id="watchlist-tab" type="button" role="tab" aria-controls="watchlist-view" aria-selected="false">Watch List</button>
        <button id="options-tab" type="button" role="tab" aria-controls="options-view" aria-selected="false">Option</button>
      </nav>

      <section class="view-stack">
        <section id="chart-view" class="view-panel chart-view" role="tabpanel" aria-labelledby="chart-tab">
          <header class="market-strip" aria-label="Điều khiển dữ liệu biểu đồ">
            <div id="symbol-control" class="control symbol-control symbol-combobox" title="Mã cổ phiếu Nhật">
              <input id="symbol-input" autocomplete="off" spellcheck="false" aria-label="Mã cổ phiếu Nhật" />
              <button id="symbol-trigger" class="symbol-combobox-trigger" type="button" aria-label="Mở Watch List" title="Watch List">▾</button>
              <div id="symbol-menu" class="symbol-combobox-menu" hidden></div>
            </div>
            <label class="control timeframe-control" title="Khung thời gian">
              <span class="visually-hidden">Khung thời gian</span>
              <select id="timeframe-select" aria-label="Khung thời gian"></select>
            </label>
            <div id="indicator-control" class="control indicator-control">
              <button
                id="indicator-trigger"
                class="indicator-trigger"
                type="button"
                aria-controls="indicator-menu"
                aria-expanded="false"
              >
                <span id="indicator-trigger-label">Indicator</span>
                <span class="indicator-trigger-caret" aria-hidden="true">▾</span>
              </button>
              <div id="indicator-menu" class="indicator-menu" hidden></div>
            </div>
            <div class="strip-actions">
              <button
                id="assistant-toggle"
                class="strip-button assistant-toggle"
                type="button"
                aria-controls="assistant-panel"
                aria-expanded="false"
                title="Mở trợ lý"
              >AI</button>
              <button id="load-selection" class="strip-button sheet-button" type="button" disabled title="Dùng vùng OHLC đang chọn trong Excel">Sheet</button>
            </div>
            <span id="status" aria-live="polite">Đang tải…</span>
          </header>
          <section class="chart-stage">
            <div id="chart" aria-label="Biến động dữ liệu">
              <span id="chart-pointer-dot" class="chart-pointer-dot" aria-hidden="true" hidden></span>
            </div>
            <aside id="assistant-panel" class="assistant-panel" aria-label="Trợ lý phân tích" hidden>
              <header class="assistant-head">
                <div class="assistant-head-bar">
                  <div class="assistant-identity">
                    <strong>Trợ lý</strong>
                    <span id="assistant-status" class="assistant-status" data-state="pending" role="status" aria-label="Đang kết nối…" title="Đang kết nối…"></span>
                  </div>
                  <div class="assistant-head-actions">
                    <button id="assistant-history-toggle" type="button" aria-label="Lịch sử trò chuyện" title="Lịch sử trò chuyện" aria-controls="assistant-history" aria-expanded="false">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
                    </button>
                    <button id="assistant-settings-toggle" type="button" aria-label="Tùy chọn" title="Tùy chọn" aria-controls="assistant-settings" aria-expanded="false">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="white"/><circle cx="16" cy="17" r="2" fill="white"/></svg>
                    </button>
                    <button id="assistant-new" type="button" aria-label="Cuộc trò chuyện mới" title="Cuộc trò chuyện mới">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button id="assistant-close" type="button" aria-label="Đóng trợ lý" title="Đóng trợ lý">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                  </div>
                </div>
                <div class="assistant-meta">
                  <span id="assistant-context" class="assistant-context">Chưa có dữ liệu chart</span>
                  <small id="assistant-quota" class="assistant-quota" hidden></small>
                </div>
              </header>
              <div id="assistant-settings" class="assistant-settings" hidden>
                <label>Provider
                  <select id="assistant-provider" aria-label="Nhà cung cấp AI">
                    <option value="chatgpt">ChatGPT</option>
                    <option value="codex">Codex</option>
                  </select>
                </label>
                <label>Model
                  <select id="assistant-model" aria-label="Model AI"></select>
                </label>
                <label>Reasoning
                  <select id="assistant-reasoning" aria-label="Mức suy luận"></select>
                </label>
              </div>
              <section id="assistant-history" class="assistant-history" aria-label="Lịch sử trò chuyện" hidden>
                <div class="assistant-history-toolbar">
                  <button id="assistant-history-back" type="button" hidden>← Danh sách</button>
                  <strong id="assistant-history-heading">Lịch sử</strong>
                  <button id="assistant-history-close" type="button">Trở lại chat</button>
                </div>
                <div id="assistant-history-items" class="assistant-history-items"></div>
                <small class="assistant-history-note">Lưu trên thiết bị này · Chỉ xem, không thay đổi phiên AI</small>
              </section>
              <div id="assistant-messages" class="assistant-messages" aria-live="polite"></div>
              <form id="assistant-form" class="assistant-form">
                <textarea id="assistant-input" rows="2" placeholder="Hỏi về chart đang xem…" aria-label="Tin nhắn cho trợ lý"></textarea>
                <div class="assistant-actions">
                  <button id="assistant-cancel" type="button" hidden>Hủy</button>
                  <span>Enter gửi · Shift+Enter xuống dòng</span>
                  <button id="assistant-send" type="submit">Gửi</button>
                </div>
              </form>
            </aside>
          </section>
        </section>

        <section id="watchlist-view" class="view-panel watchlist-view" role="tabpanel" aria-labelledby="watchlist-tab" hidden>
          <header class="watchlist-toolbar">
            <div id="watchlist-symbol-control" class="watchlist-add-control symbol-combobox">
              <input id="watchlist-symbol-input" autocomplete="off" spellcheck="false" placeholder="Thêm mã TSE" aria-label="Thêm mã vào Watch List" />
              <div id="watchlist-symbol-menu" class="symbol-combobox-menu symbol-combobox-menu-wide" hidden></div>
            </div>
            <button id="watchlist-add" type="button">Thêm</button>
            <span id="watchlist-status" aria-live="polite"></span>
          </header>
          <div class="watchlist-head" aria-hidden="true">
            <span>Mã <small id="watchlist-count">0</small></span>
            <span>Giá</span>
            <span>% ngày</span>
            <span></span>
          </div>
          <div id="watchlist-list" class="watchlist-list" role="list"></div>
          <div id="watchlist-empty" class="watchlist-empty" hidden>Chưa có mã trong Watch List.</div>
        </section>

        <section id="options-view" class="view-panel options-view" role="tabpanel" aria-labelledby="options-tab" hidden>
          <div class="options-card">
            <label class="option-toggle" for="candles-on-hover-only">
              <span class="option-copy">
                <strong>Chỉ hiện nến khi rê chuột</strong>
                <small>Ẩn nến khi chuột rời add-in; dữ liệu, scale và indicator vẫn được giữ nguyên.</small>
              </span>
              <input id="candles-on-hover-only" type="checkbox" />
            </label>
          </div>
        </section>
      </section>
    </main>
    <div id="param-overlay" hidden>
      <section id="param-box" role="dialog" aria-modal="true" aria-labelledby="param-title">
        <header id="param-head">
          <strong id="param-title"></strong>
          <button id="param-close" type="button" aria-label="Đóng">×</button>
        </header>
        <div id="param-fields"></div>
        <footer id="param-actions">
          <button id="param-reset" type="button">Mặc định</button>
          <span></span>
          <button id="param-cancel" type="button">Hủy</button>
          <button id="param-ok" type="button">OK</button>
        </footer>
      </section>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
